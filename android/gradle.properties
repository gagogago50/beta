# Gradle JVM tuning.
#
# These values are sized for a CI runner (~7 GB) AND a modest dev machine,
# not a workstation: an 8 GB heap + 4 GB metaspace on the runner OOMs Gradle
# mid-build (visible as `Gradle build daemon disappeared`). A debug build
# needs a few hundred MB; keep the heap predictable and below the runner limit.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED

# One Gradle daemon, one worker at a time: on a constrained CI runner this
# keeps memory flat and avoids the daemon being OOM-killed while compiling
# the Kotlin/Flutter layers.
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1

# AndroidX is required; keep the Flutter-migrator flags as they are.
android.useAndroidX=true
android.builtInKotlin=false
android.newDsl=false
